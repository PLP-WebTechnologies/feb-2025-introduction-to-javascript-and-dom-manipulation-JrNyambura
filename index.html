<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript DOM Manipulation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="main-heading">Welcome to My Page</h1>
  </header>

  <main>
    <section>
      <p id="message">Click the button to change this text!</p>
      <button id="change-text-btn">Change Text</button>
    </section>

    <section>
      <button id="toggle-style-btn">Toggle Highlight</button>
    </section>

    <section>
      <button id="add-element-btn">Add Item</button>
      <button id="remove-element-btn">Remove Item</button>
      <ul id="item-list">
        <li>First Item</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>© 2025 Your Name</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
